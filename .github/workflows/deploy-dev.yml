name: Deploy Dev Environment

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: SAM Build Application
        run: sam build --template-file infrastructure/template.yaml

      - name: Auto-Clean ROLLBACK_COMPLETE Stack
        run: |
          echo "Checando status atual da stack credifacil-idp-dev..."
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name credifacil-idp-dev --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "STACK_NOT_FOUND")
          
          echo "Status detectado: $STACK_STATUS"
          
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "⚠️ Stack detectada em ROLLBACK_COMPLETE. Iniciando expurgo automático..."
            aws cloudformation delete-stack --stack-name credifacil-idp-dev
            
            echo "Aguardando a AWS finalizar a exclusao..."
            aws cloudformation wait stack-delete-complete --stack-name credifacil-idp-dev
            echo "✅ Terreno limpo com sucesso! Pronto para o novo deploy."
          else
            echo "✅ Stack inexistente ou em estado saudavel. Seguindo em frente."
          fi

      - name: SAM Deploy to AWS
        if: github.event_name == 'push'
        env:
          BDA_ID: ${{ secrets.BDA_PROJECT_ID }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          BDA_VAL="${BDA_ID:-e1a9e2ae3eb7}"
          BUCKET_NAME="sam-artifacts-credifacil-idp-dev"

          echo "🔎 Verificando existência do bucket de artefatos personalizado..."
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "🔨 Bucket não encontrado. Criando bucket estável de artefatos..."
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region us-east-1
          fi

          sam deploy \
            --stack-name credifacil-idp-dev \
            --s3-bucket "$BUCKET_NAME" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=dev \
              BdaProjectId="$BDA_VAL" \
              NotificationEmail="$NOTIFICATION_EMAIL" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND

      - name: Build Front-End (Vite Compilation)
        if: github.event_name == 'push'
        run: |
          echo "🟢 Entrando na pasta do front-end..."
          cd frontend
          
          echo "📦 Instalando dependências do projeto..."
          npm ci 
          
          echo "⚙️ Injetando variáveis de ambiente dinâmicas para o build..."

          # 1. Captura o endpoint da API Gateway
          API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name credifacil-idp-dev \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)
          
          # Captura o ID do diretório de usuários do Cognito
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name credifacil-idp-dev \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)

          # Captura o ID do cliente do front-end do Cognito
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name credifacil-idp-dev \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          
          # Escreve a primeira variável criando o arquivo limpo (>)
          echo "VITE_API_URL=$API_ENDPOINT" > .env
          
          # Acrescenta as novas variáveis ao final do mesmo arquivo (>>)
          echo "VITE_USER_POOL_ID=$USER_POOL_ID" >> .env
          echo "VITE_USER_POOL_CLIENT_ID=$USER_POOL_CLIENT_ID" >> .env
          
          echo "🛡️ Auditoria FinOps: Variáveis injetadas no container com sucesso!"
          
          echo "🛠️ Compilando os assets estáticos de produção..."
          npm run build
          
          echo "✅ Pasta dist/ gerada com sucesso!"
          ls -la dist/
          
      - name: Deploy Front-End to S3 & Invalidate CloudFront
        if: github.event_name == 'push'
        run: |
          echo "🔍 Capturando dinamicamente as informações de saída da Stack..."
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name credifacil-idp-dev \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET_NAME="credifacil-idp-frontend-${ACCOUNT_ID}-dev"
          
          echo "✅ ID do CloudFront Detectado: $DIST_ID"
          echo "✅ Bucket do S3 Detectado: $BUCKET_NAME"
          
          echo "📦 Iniciando publicação automática dos arquivos estáticos para o S3..."
          aws s3 sync frontend/dist/ s3://$BUCKET_NAME --delete
          
          echo "⚡ Disparando invalidação de cache no CloudFront..."
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          echo "🎉 Front-End atualizado e cache invalidado com sucesso!"