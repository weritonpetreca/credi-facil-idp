# ==========================================================================
# 🛠️ CAMADA DE INFRAESTRUTURA COMO CÓDIGO (AWS SAM TEMPLATE) - REVISADA
# ==========================================================================
# Projeto: CrediFácil IDP Engine
# Padrão Arquitetural: Smart Writer Pattern & Desacoplamento SOLID (S.R.P)
# Versão: 2026.06.26_FinOps_Compliant
# ==========================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CrediFacil IDP - Pipeline IDP Serverless com Rastreabilidade Total de Custos FinOps

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  BdaProjectId:
    Type: String
    Default: "e1a9e2ae3eb7"

Globals:
  Function:
    Runtime: python3.12
    Architectures: 
      - arm64
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Layers:
      - !Ref CrediFacilDependenciesLayer
    Environment:
      Variables:
        ENV: !Ref Environment
        DYNAMODB_TABLE: !Ref CrediFacilDynamoTable
        CLIENTS_DYNAMODB_TABLE: !Ref CrediFacilClientesTable
        SNS_COMPLETION_TOPIC_ARN: !Ref SnsTopicoConclusao
        SNS_ERROR_TOPIC_ARN: !Ref SnsTopicoErros

Resources:
  # ==========================================================================
  # 🔑 DEPENDÊNCIAS & COMPONENTES BASE
  # ==========================================================================
  CrediFacilDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "credifacil-dependencies-${Environment}"
      ContentUri: ../src/layers/dependencies/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
    Metadata:
      BuildMethod: python3.12

  BucketEntrada:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "credifacil-docs-entrada-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AutoDeleteDevTestFiles
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - "PUT"
              - "POST"
              - "GET"
            AllowedOrigins:
              - "*"
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  BucketSaida:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AutoDeleteDevOutputFiles
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - "GET"
            AllowedOrigins:
              - "*"
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  CrediFacilFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "credifacil-idp-frontend-${AWS::AccountId}-${Environment}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  CrediFacilCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "credifacil-frontend-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CrediFacilCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt CrediFacilFrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CrediFacilCloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  CrediFacilFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CrediFacilFrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::credifacil-idp-frontend-${AWS::AccountId}-${Environment}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CrediFacilCloudFrontDistribution}"

  # ==========================================================================
  # 🗄️ CAMADA DE ARMAZENAMENTO (Tabelas Isoladas de Domínio)
  # ==========================================================================
  CrediFacilDynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "credifacil-pacotes-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  CrediFacilClientesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "credifacil-clientes-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # 📢 ECOSSISTEMA DE MENSAGERIA (Amazon SNS)
  # ==========================================================================
  SnsTopicoConclusao:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "credifacil-conclusao-${Environment}"
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  SnsTopicoErros:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "credifacil-erros-${Environment}"
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # 🌐 INFRAESTRUTURA ORIENTADA A EVENTOS (EVENTBRIDGE & SQS)
  # ==========================================================================
  CrediFacilEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "credifacil-idp-bus-${Environment}"
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  CrediFacilReviewDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "credifacil-human-review-dlq-${Environment}"
      MessageRetentionPeriod: 1209600 
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  CrediFacilReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "credifacil-human-review-queue-${Environment}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CrediFacilReviewDLQ.Arn
        maxReceiveCount: 3 
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  CrediFacilDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alerta ativo de mensagens retidas na DLQ de Revisão Humana do CrediFácil"
      Namespace: "AWS/SQS"
      MetricName: "ApproximateNumberOfMessagesVisible"
      Dimensions:
        - Name: "QueueName"
          Value: !GetAtt CrediFacilReviewDLQ.QueueName
      Statistic: "Sum"
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      AlarmActions:
        - !Ref SnsTopicoErros
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  LowConfidenceRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "credifacil-low-confidence-rule-${Environment}"
      EventBusName: !Ref CrediFacilEventBus
      EventPattern:
        source:
          - "credifacil.idp"
        detail-type:
          - "LowConfidenceFieldsDetected"
      Targets:
        - Arn: !GetAtt CrediFacilReviewQueue.Arn
          Id: "ReviewQueueTarget"

  QueuePolicyForEventBridge:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CrediFacilReviewQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "events.amazonaws.com"
            Action: "sqs:SendMessage"
            Resource: !GetAtt CrediFacilReviewQueue.Arn

  # ==========================================================================
  # 🌐 CAMADA DE EXPOSIÇÃO DA API REST (PROTEGIDA POR PADRÃO) - SCHEMA FINAL
  # ==========================================================================
  CrediFacilRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CrediFacilUserPool.Arn
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  # ==========================================================================
  # 🚀 COMPONENTES DE ENTRADA
  # ==========================================================================
  PreSignedUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.pre_signed_url.handler.handler
      Environment:
        Variables:
          BUCKET_ENTRADA: !Sub "credifacil-docs-entrada-${AWS::AccountId}-${Environment}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "credifacil-docs-entrada-${AWS::AccountId}-${Environment}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "credifacil-pacotes-${Environment}"
      Events:
        ApiGatewayTrigger:
          Type: Api
          Properties:
            Path: /v1/packages/upload-urls
            Method: post
            RestApiId: !Ref CrediFacilRestApi
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  PipelineTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.pipeline_trigger.handler.handler
      Environment:
        Variables:
          BUCKET_SAIDA: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
          STATE_MACHINE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:credifacil-idp-pipeline-${Environment}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "credifacil-pacotes-${Environment}"
        - Statement:
            - Sid: AllowStepFunctionsExecution
              Effect: Allow
              Action: "states:StartExecution"
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:credifacil-idp-pipeline-${Environment}"
      Events:
        ApiGatewayTrigger:
          Type: Api
          Properties:
            Path: /v1/packages/{packageId}/process
            Method: post
            RestApiId: !Ref CrediFacilRestApi
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  S3UploadTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.s3_upload_tracker.handler.handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          BUCKET_SAIDA: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
          STATE_MACHINE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:credifacil-idp-pipeline-${Environment}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "credifacil-pacotes-${Environment}"
        - Statement:
            - Sid: AllowStepFunctionsExecution
              Effect: Allow
              Action: "states:StartExecution"
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:credifacil-idp-pipeline-${Environment}"
      Events:
        S3ObjectCreatedEvent:
          Type: S3
          Properties:
            Bucket: !Ref BucketEntrada
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: packages/
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  # ==========================================================================
  # 💡 COMPONENTES INTERNOS DO WORKFLOW
  # ==========================================================================
  BdaInvokerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.bda_invoker.handler.handler
      MemorySize: 512
      Environment:
        Variables:
          BDA_PROJECT_ARN: !Sub "arn:aws:bedrock:us-east-1:${AWS::AccountId}:data-automation-project/${BdaProjectId}"
          BUCKET_ENTRADA: !Sub "credifacil-docs-entrada-${AWS::AccountId}-${Environment}"
          BUCKET_SAIDA: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "credifacil-docs-entrada-${AWS::AccountId}-${Environment}"
        - S3CrudPolicy:
            BucketName: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
        - Statement:
            - Sid: PermissaoListagemParaPastasS3
              Effect: Allow
              Action:
                - "s3:ListBucket"
                - "s3:ListBucketVersions"
              Resource:
                - !Sub "arn:aws:s3:::credifacil-docs-entrada-${AWS::AccountId}-${Environment}"
                - !Sub "arn:aws:s3:::credifacil-docs-saida-${AWS::AccountId}-${Environment}"
            - Sid: AllowBedrockAutomationAsync
              Effect: Allow
              Action: 
                - "bedrock:InvokeDataAutomationAsync"
                - "sts:GetCallerIdentity"
              Resource: "*"
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  BdaStatusPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.bda_status_poller.handler.handler
      Policies:
        - Statement:
            - Sid: AllowGetAutomationStatus
              Effect: Allow
              Action: "bedrock:GetDataAutomationStatus"
              Resource: "*"
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  ConfidenceCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.confidence_checker.handler.handler
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref CrediFacilEventBus
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "credifacil-pacotes-${Environment}"
        - Statement:
            - Effect: Allow
              Action: "events:PutEvents"
              Resource: !GetAtt CrediFacilEventBus.Arn
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  NovaStructurerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.nova_structurer.handler.handler
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          BUCKET_ENTRADA: !Sub "credifacil-docs-entrada-${AWS::AccountId}-${Environment}"
          BUCKET_SAIDA: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
          BDA_PROJECT_ARN: !Sub "arn:aws:bedrock:us-east-1:${AWS::AccountId}:data-automation-project/${BdaProjectId}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
        - DynamoDBReadPolicy:
            TableName: !Sub "credifacil-pacotes-${Environment}"
        - Statement:
            - Sid: AllowBedrockNovaInvoke
              Effect: Allow
              Action: "bedrock:InvokeModel"
              Resource: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0"
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  ExcelGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub credifacil-excel-generator-${Environment}
      CodeUri: ../
      Handler: src.lambdas.excel_generator.handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ENV: !Ref Environment
          DYNAMODB_TABLE: !Ref CrediFacilDynamoTable
          BUCKET_SAIDA: !Ref BucketSaida
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref BucketSaida
        - S3WritePolicy:
            BucketName: !Ref BucketSaida
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  CustomerConsolidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.customer_consolidator.handler.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
        - Statement:
            - Effect: Allow
              Action: "bedrock:InvokeModel"
              Resource: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0"
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  ResultWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.result_writer.handler.handler
      Environment:
        Variables:
          BUCKET_SAIDA: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "credifacil-pacotes-${Environment}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "credifacil-clientes-${Environment}"
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  QueryHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.query_handler.handler.handler
      Environment:
        Variables:
          BUCKET_SAIDA: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "credifacil-pacotes-${Environment}"
        - DynamoDBReadPolicy:
            TableName: !Sub "credifacil-clientes-${Environment}"
        - S3ReadPolicy:
            BucketName: !Sub "credifacil-docs-saida-${AWS::AccountId}-${Environment}"
      Events:
        ApiGatewayTrigger:
          Type: Api
          Properties:
            Path: /v1/packages/{packageId}
            Method: get
            RestApiId: !Ref CrediFacilRestApi
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src.lambdas.notification.handler.handler
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !Sub "credifacil-conclusao-${Environment}"
        - SNSPublishMessagePolicy:
            TopicName: !Sub "credifacil-erros-${Environment}"
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  CrediFacilStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "credifacil-idp-pipeline-${Environment}"
      DefinitionUri: ../state_machines/idp_pipeline.json
      Role: !GetAtt CrediFacilStateMachineRole.Arn
      DefinitionSubstitutions:
        BdaInvokerArn: !GetAtt BdaInvokerFunction.Arn
        BdaStatusPollerArn: !GetAtt BdaStatusPollerFunction.Arn
        ConfidenceCheckerArn: !GetAtt ConfidenceCheckerFunction.Arn
        NovaStructurerArn: !GetAtt NovaStructurerFunction.Arn
        ExcelGeneratorArn: !GetAtt ExcelGeneratorFunction.Arn
        CustomerConsolidatorArn: !GetAtt CustomerConsolidatorFunction.Arn
        ResultWriterArn: !GetAtt ResultWriterFunction.Arn
        NotificationArn: !GetAtt NotificationFunction.Arn
    Tags:
      Project: CrediFacil-IDP
      Environment: !Ref Environment

  CrediFacilStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CrediFacilStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowLambdaInvocation
                Effect: Allow
                Action: "lambda:InvokeFunction"
                Resource:
                  - !GetAtt BdaInvokerFunction.Arn
                  - !GetAtt BdaStatusPollerFunction.Arn
                  - !GetAtt ConfidenceCheckerFunction.Arn
                  - !GetAtt NovaStructurerFunction.Arn
                  - !GetAtt ExcelGeneratorFunction.Arn
                  - !GetAtt CustomerConsolidatorFunction.Arn
                  - !GetAtt ResultWriterFunction.Arn
                  - !GetAtt NotificationFunction.Arn
      Tags:
        - Key: Project
          Value: CrediFacil-IDP
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # 🛡️ CAMADA DE SEGURANÇA E IDENTIDADE (AMAZON COGNITO B2B)
  # ==========================================================================
  CrediFacilUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "credifacil-user-pool-${Environment}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  CrediFacilUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "credifacil-frontend-client-${Environment}"
      UserPoolId: !Ref CrediFacilUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  ApiEndpoint:
    Description: URL Base da API REST no API Gateway
    Value: !Sub "https://${CrediFacilRestApi}.execute-api.us-east-1.amazonaws.com/${Environment}/"

  FrontendCloudFrontUrl:
    Description: URL Oficial de Acesso ao Front-end do CrediFácil (Via CloudFront CDN)
    Value: !Sub "https://${CrediFacilCloudFrontDistribution.DomainName}"

  CloudFrontDistributionId:
    Description: ID da Distribuicao do CloudFront para Invalidação de Cache
    Value: !Ref CrediFacilCloudFrontDistribution

  UserPoolId:
    Description: ID do Diretório de Usuários Cognito
    Value: !Ref CrediFacilUserPool

  UserPoolClientId:
    Description: ID do Cliente do Cognito para o Front-End
    Value: !Ref CrediFacilUserPoolClient